  <script>
    let scene, camera, renderer, controls;
    let sphereMesh, textureLoader;
    let currentPanorama = '';
    let hotspots = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function initViewer() {
      const container = document.getElementById('panorama-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, width / height, 1, 1100);
      camera.target = new THREE.Vector3(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;
      controls.enablePan = false;
      controls.rotateSpeed = -0.3;
      controls.minDistance = 1;
      controls.maxDistance = 100;

      // 360 Sphere Geometry (Inverted Normals for inner viewing)
      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1);

      const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
      sphereMesh = new THREE.Mesh(geometry, material);
      scene.add(sphereMesh);

      textureLoader = new THREE.TextureLoader();

      window.addEventListener('resize', onResize);
      renderer.domElement.addEventListener('click', onPointerClick);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      const container = document.getElementById('panorama-container');
      if (!container) return;
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function clearHotspots() {
      hotspots.forEach(hs => scene.remove(hs));
      hotspots = [];
    }

    function switchPanorama(panoId) {
      if (!panoId) return;
      currentPanorama = panoId;
      clearHotspots();

      const titleElem = document.getElementById('pano-title');
      if (titleElem) titleElem.textContent = panoId;

      textureLoader.load(
        panoId,
        (texture) => {
          texture.minFilter = THREE.LinearFilter;
          sphereMesh.material.map = texture;
          sphereMesh.material.needsUpdate = true;
          renderHotspotsForPanorama(panoId);
        },
        undefined,
        (err) => {
          console.error('Error loading panorama:', panoId, err);
        }
      );
    }

    function addHotspot(iconPath, position, onClick) {
      const texture = textureLoader.load(iconPath || 'images/chevronforward.png');
      const spriteMaterial = new THREE.SpriteMaterial({
        map: texture,
        depthTest: false
      });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(40, 40, 1);

      if (position instanceof THREE.Vector3) {
        sprite.position.copy(position);
      } else if (Array.isArray(position)) {
        sprite.position.set(position[0], position[1], position[2]);
      }

      sprite.userData = { onClick };
      scene.add(sprite);
      hotspots.push(sprite);
    }

    function onPointerClick(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(hotspots);

      if (intersects.length > 0) {
        const clickedSprite = intersects[0].object;
        if (clickedSprite.userData && clickedSprite.userData.onClick) {
          clickedSprite.userData.onClick();
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initViewer();
      switchPanorama('1.jpeg');
    });
  </script>
